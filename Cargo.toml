[package]
name = "canopy"
version = "1.0.0"
edition = "2021"
description = "Interactive phylogenetic tree visualization (ggtree-style) with a GUI"
license = "MIT OR Apache-2.0"
default-run = "canopy"

[lib]
name = "canopy"
path = "src/lib.rs"

[[bin]]
name = "canopy"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29.1"
rfd = "0.15.1"
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg", "ico"] }
png = "0.17.14"
tiff = "0.9.1"
tiny-skia = "0.11.4"
ab_glyph = "0.2.29"
ureq = "2.10.1"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
csv = "1.3.1"
dirs = "5.0.1"
base64 = "0.22.1"
anyhow = "1.0.93"
regex = "1.11.1"
roxmltree = "0.20.0"
svg2pdf = "0.13.0"
resvg = { version = "0.45.1", default-features = false }

[build-dependencies]
winresource = "0.1.17"
resvg = { version = "0.45.1", default-features = false }
png = "0.17.14"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
