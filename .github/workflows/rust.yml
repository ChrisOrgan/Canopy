name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # allows "Run workflow" from the Actions tab

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # one platform failing doesn't cancel the others
      matrix:
        include:
          - name: Linux (x64)
            os: ubuntu-latest
          - name: Windows (x64)
            os: windows-latest
          - name: Windows (ARM64)
            os: windows-11-arm
          - name: macOS (Apple silicon)
            os: macos-latest

    steps:
    - uses: actions/checkout@v7

    # GTK (file dialogs) and X11/Wayland libraries for the GUI on Linux.
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache build
      uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose
